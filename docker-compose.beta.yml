services:
  database:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - database_data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - sigal_internal

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - application_storage:/var/www/html/storage
    networks:
      - sigal_internal

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${SIGAL_BIND_IP}:80:80"
      - "${SIGAL_BIND_IP}:443:443"
    volumes:
      - application_storage:/var/www/html/storage:ro
      - ./certificates:/etc/nginx/certs:ro
    networks:
      - sigal_internal

volumes:
  database_data:
  application_storage:

networks:
  sigal_internal:
    driver: bridge
